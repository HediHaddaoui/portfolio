<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- Ambient light circles -->
  <circle cx="300" cy="250" r="280" fill="#0284c7" fill-opacity="0.12" filter="blur(60px)" />
  <circle cx="1300" cy="750" r="320" fill="#38bdf8" fill-opacity="0.1" filter="blur(70px)" />

  <!-- Card Border -->
  <rect x="80" y="80" width="1440" height="840" rx="32" fill="#111827" fill-opacity="0.75" stroke="#1e293b" stroke-width="2" />

  <!-- Map Grid representation -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8">
    <line x1="800" y1="120" x2="800" y2="880" />
    <line x1="1050" y1="120" x2="1050" y2="880" />
    <line x1="1300" y1="120" x2="1300" y2="880" />
    <line x1="750" y1="280" x2="1480" y2="280" />
    <line x1="750" y1="520" x2="1480" y2="520" />
    <line x1="750" y1="740" x2="1480" y2="740" />
  </g>

  <!-- Left Content Info -->
  <rect x="160" y="180" width="140" height="38" rx="19" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
  <text x="230" y="204" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2">MOBILE &amp; CLOUD</text>

  <text x="160" y="290" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800">Supervision du</text>
  <text x="160" y="355" fill="url(#primaryGlow)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800">Transport Public</text>

  <text x="160" y="420" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400">Suivi temps réel &amp; géolocalisation des réseaux de bus en Tunisie</text>

  <!-- Tech Badges -->
  <g transform="translate(160, 480)">
    <rect x="0" y="0" width="120" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="60" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Flutter</text>

    <rect x="135" y="0" width="130" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="200" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Firebase</text>

    <rect x="280" y="0" width="140" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="350" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Google Maps</text>

    <rect x="435" y="0" width="110" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="490" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Firestore</text>
  </g>

  <!-- Key Metrics / Stats -->
  <g transform="translate(160, 600)">
    <rect x="0" y="0" width="220" height="110" rx="20" fill="#0f172a" stroke="#1e293b" />
    <text x="30" y="48" fill="#38bdf8" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800">100%</text>
    <text x="30" y="80" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="500">Temps Réel</text>

    <rect x="250" y="0" width="220" height="110" rx="20" fill="#0f172a" stroke="#1e293b" />
    <text x="280" y="48" fill="#f59e0b" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800">GPS</text>
    <text x="280" y="80" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="500">Précision Lignes</text>
  </g>

  <!-- Right Graphic: Mobile Device Mockup / Map -->
  <g transform="translate(880, 180)">
    <!-- Phone outline -->
    <rect x="0" y="0" width="360" height="640" rx="42" fill="#090d16" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />
    <rect x="14" y="14" width="332" height="612" rx="32" fill="#0f172a" />
    
    <!-- Phone Notch -->
    <rect x="120" y="22" width="120" height="16" rx="8" fill="#1e293b" />

    <!-- Route path inside phone -->
    <path d="M 60 480 Q 180 380 140 260 T 280 140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Pulse pins on path -->
    <circle cx="60" cy="480" r="14" fill="#0284c7" />
    <circle cx="60" cy="480" r="7" fill="#ffffff" />

    <circle cx="140" cy="260" r="18" fill="#f59e0b" fill-opacity="0.4" />
    <circle cx="140" cy="260" r="10" fill="#f59e0b" />
    <circle cx="140" cy="260" r="5" fill="#ffffff" />

    <circle cx="280" cy="140" r="14" fill="#10b981" />
    <circle cx="280" cy="140" r="7" fill="#ffffff" />

    <!-- In-app UI card -->
    <rect x="36" y="500" width="288" height="96" rx="16" fill="#1e293b" stroke="#334155" />
    <circle cx="70" cy="548" r="20" fill="#0284c7" fill-opacity="0.3" />
    <text x="70" y="555" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui" font-size="20">🚌</text>
    <text x="105" y="540" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="700">Ligne Express 24</text>
    <text x="105" y="565" fill="#38bdf8" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="500">Arrivée estimée : 3 min</text>
  </g>
</svg>
