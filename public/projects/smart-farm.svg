<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="farmGrad" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061c14" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#farmGrad)" />

  <!-- Ambient light -->
  <circle cx="350" cy="280" r="300" fill="#059669" fill-opacity="0.12" filter="blur(65px)" />
  <circle cx="1250" cy="700" r="300" fill="#10b981" fill-opacity="0.08" filter="blur(65px)" />

  <!-- Main Card -->
  <rect x="80" y="80" width="1440" height="840" rx="32" fill="#0f172a" fill-opacity="0.8" stroke="#134e4a" stroke-width="2" />

  <!-- Category badge -->
  <rect x="160" y="180" width="150" height="38" rx="19" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5" />
  <text x="235" y="204" text-anchor="middle" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2">IOT &amp; CLOUD</text>

  <!-- Title -->
  <text x="160" y="290" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800">Smart Farm</text>
  <text x="160" y="355" fill="url(#emeraldGlow)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800">Supervision Agricole</text>

  <text x="160" y="420" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400">Monitoring environnemental, humidité &amp; température via MQTT</text>

  <!-- Tech tags -->
  <g transform="translate(160, 480)">
    <rect x="0" y="0" width="110" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="55" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">ESP32</text>

    <rect x="125" y="0" width="100" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="175" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">MQTT</text>

    <rect x="240" y="0" width="130" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="305" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Node-RED</text>

    <rect x="385" y="0" width="140" height="42" rx="21" fill="#1e293b" stroke="#334155" />
    <text x="455" y="26" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Capteurs DHT</text>
  </g>

  <!-- Sensor metrics -->
  <g transform="translate(160, 600)">
    <rect x="0" y="0" width="220" height="110" rx="20" fill="#0b1220" stroke="#134e4a" />
    <text x="30" y="48" fill="#34d399" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800">68%</text>
    <text x="30" y="80" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="500">Humidité du sol</text>

    <rect x="250" y="0" width="220" height="110" rx="20" fill="#0b1220" stroke="#134e4a" />
    <text x="280" y="48" fill="#38bdf8" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800">24.5°C</text>
    <text x="280" y="80" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="500">Température Serre</text>
  </g>

  <!-- Right Visual: Node-RED dashboard widget representation -->
  <g transform="translate(850, 180)">
    <rect x="0" y="0" width="560" height="520" rx="28" fill="#090d16" stroke="#059669" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Top bar -->
    <rect x="0" y="0" width="560" height="60" rx="28" fill="#1e293b" />
    <circle cx="40" cy="30" r="8" fill="#ef4444" />
    <circle cx="65" cy="30" r="8" fill="#f59e0b" />
    <circle cx="90" cy="30" r="8" fill="#10b981" />
    <text x="280" y="36" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="16">node-red/dashboard/smart-farm</text>

    <!-- Node-RED Flow Lines -->
    <path d="M 80 160 L 220 160 L 280 260 L 460 260" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 6" />
    <path d="M 80 360 L 220 360 L 280 260" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Node Box 1 (Sensor ESP32) -->
    <rect x="40" y="130" width="130" height="60" rx="12" fill="#047857" />
    <text x="105" y="165" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="700">ESP32 In</text>

    <!-- Node Box 2 (MQTT Broker) -->
    <rect x="220" y="230" width="140" height="60" rx="12" fill="#0284c7" />
    <text x="290" y="265" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="700">MQTT Broker</text>

    <!-- Node Box 3 (Actuator / Relais) -->
    <rect x="400" y="230" width="130" height="60" rx="12" fill="#b91c1c" />
    <text x="465" y="265" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="700">Electrovanne</text>

    <!-- Sensor 2 -->
    <rect x="40" y="330" width="130" height="60" rx="12" fill="#0f766e" />
    <text x="105" y="365" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="700">DHT22 Probe</text>

    <!-- Telemetry mini chart -->
    <g transform="translate(60, 420)">
      <rect x="0" y="0" width="440" height="70" rx="12" fill="#111827" stroke="#1f2937" />
      <path d="M 20 50 Q 80 20 140 40 T 260 25 T 380 45 L 420 30" fill="none" stroke="#34d399" stroke-width="3" />
      <text x="20" y="-8" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="12">Historique Humidité (24h)</text>
    </g>
  </g>
</svg>
